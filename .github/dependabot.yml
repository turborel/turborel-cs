# Updates proposed weekly, for the test packages (RULES.md D12) and the
# workflows' actions, each pinned by its commit SHA (R-PROC-6, D4). The
# library has no package to update (R-DEP-1).
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      test:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "area/ci"]
    groups:
      actions:
        patterns: ["*"]
