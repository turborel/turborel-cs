# Kinds
- name: "bug"
  color: "#d73a4a"
  description: "The driver fails, crashes, hangs, or gives a wrong value or error"
- name: "conformance"
  color: "#5c282b"
  description: "A departure from the protocol spec or from turborel-client"
- name: "performance"
  color: "#fbca04"
  description: "Slower than it was or should be, or too much memory"
- name: "feature"
  color: "#a2eeef"
  description: "Something turborel-cs should do that it does not"
- name: "documentation"
  color: "#0075ca"
  description: "Improvements or additions to documentation"

# Impact
- name: "impact/wrong-value"
  color: "#b60205"
  description: "A value sent or read differs from what was stored or given"
- name: "impact/crash"
  color: "#b60205"
  description: "An exception the driver should not throw, a hang, or memory without bound"
- name: "impact/regression"
  color: "#b60205"
  description: "Worked, or was faster, at an earlier commit"

# Areas
- name: "area/codec"
  color: "#c5def5"
  description: "Protocol/: frames, fields, the tail, types and values, JSON, compression"
- name: "area/transport"
  color: "#c5def5"
  description: "Transport/: TCP, Unix sockets, named pipes, timeouts"
- name: "area/auth"
  color: "#c5def5"
  description: "Authentication/: the mechanisms, SCRAM and its key cache"
- name: "area/tls"
  color: "#c5def5"
  description: "Tls/: TLS, its modes and channel binding"
- name: "area/session"
  color: "#c5def5"
  description: "Session/: Hello and Ready, status, notices, cancel, ping, reset, change-user"
- name: "area/statements"
  color: "#c5def5"
  description: "Statements/: queries, prepared statements, cursors, completions"
- name: "area/lobs"
  color: "#c5def5"
  description: "LargeObjects/: locators, reads and writes, streams"
- name: "area/copy"
  color: "#c5def5"
  description: "Copy/: copy, import and export"
- name: "area/settings"
  color: "#c5def5"
  description: "Settings/: the URI, the environment, service and password files, several servers"
- name: "area/pipeline"
  color: "#c5def5"
  description: "Pipelines/: pipelines"
- name: "area/pool"
  color: "#c5def5"
  description: "Pooling/: pools, and the SQL-agent"
- name: "area/api"
  color: "#c5def5"
  description: "The ADO.NET types at the top of src/Turborel.Data/"
- name: "area/test"
  color: "#c5def5"
  description: "test/Turborel.Data.Tests/"
- name: "area/doc"
  color: "#c5def5"
  description: "doc/, README.md, RULES.md, CONFORMANCE.md, TODO.md, AGENTS.md, CONTRIBUTING.md"
- name: "area/ci"
  color: "#c5def5"
  description: "The workflows, issue forms, labels and Dependabot in .github/"
- name: "area/build"
  color: "#c5def5"
  description: "The solution, project files, Directory.*.props, global.json, .editorconfig, .githooks/"
- name: "dependencies"
  color: "#0366d6"
  description: "A package or the SDK changes (RULES.md R-DEP-1, R-DEP-3)"

# Triage
- name: "duplicate"
  color: "#cfd3d7"
  description: "This issue or pull request already exists"
- name: "invalid"
  color: "#e4e669"
  description: "This doesn't seem right"
- name: "question"
  color: "#d876e3"
  description: "Further information is requested"
- name: "wontfix"
  color: "#ffffff"
  description: "This will not be worked on"
- name: "good first issue"
  color: "#7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "#008672"
  description: "Extra attention is needed"
