name: Performance
description: Something is slower than it was, or than it should be, or takes too much memory.
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: Numbers, not impressions. Put `[REGRESSION]` first in the title if an earlier commit was faster.
  - type: textarea
    id: summary
    attributes:
      label: What is slow
      description: The workload, and what it costs (time, throughput, memory, allocations), against what you expected and why, such as turborel-client doing the same.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The program, the schema, how much data and how it is made, and the statements timed, with how many connections at once.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: measured
    attributes:
      label: Measurements
      description: What you measured and how, with several runs, such as BenchmarkDotNet's report on the good commit and the bad one.
      render: text
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression
      description: If it was faster before, give the last good commit and, if you ran `git bisect`, the first bad one.
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short=12 HEAD`"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The platform, processor, cores and memory, the .NET runtime, the server's version and where it runs, and how the program connected (TCP, TLS, a Unix socket or a named pipe).
    validations:
      required: true
