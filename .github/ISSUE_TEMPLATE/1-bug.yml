name: Bug
description: The driver fails, crashes, hangs, or gives a wrong value or error.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Try the latest `main` first, and search the issues: add to one that matches.
        A vulnerability is never reported here: see SECURITY.md. A fault of the server is reported to turborel.
        Put a severe impact first in the title: `[WRONG VALUE]`, `[CRASH]` or `[REGRESSION]`.
  - type: textarea
    id: summary
    attributes:
      label: What happens
      description: The impact first, in a short paragraph. Then one sentence that sums it up.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - A wrong value sent or read
        - An exception the driver should not throw, a crash or a hang
        - Wrong error, SQLCODE or SQLSTATE
        - A connection that fails, or drops
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        The smallest program that shows it, with the schema, data and statements it needs, from an empty database.
        Give the settings it connects by, the password left out.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen, and why. Cite the section of the protocol or of turborel-client's manual if it says, e.g. `[PROTOCOL Frames]`.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead. Give the exception's SQLCODE, SQLSTATE and message, and its stack trace.
      render: text
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression
      description: If it worked before, give the last good commit and, if you ran `git bisect`, the first bad one.
  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short=12 HEAD`"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server
      description: The turborel server's version and commit, and whether it runs as the nightly image or built from source.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: .NET
      description: The runtime the program ran on, from `dotnet --info`, e.g. ".NET 10.0.15".
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: The operating system and version, and the architecture, e.g. "Ubuntu 24.04, x86_64".
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: How it connected
      options:
        - TCP
        - TCP with TLS
        - A Unix socket
        - A Windows named pipe
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Diagnostics, how often it happens, what you ruled out.
