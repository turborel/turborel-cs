# Every check a change must pass, by the one command (RULES.md D4,
# R-PROC-1), on each platform and runtime the driver supports (D3,
# R-PLAT-1), with the coverage floor (D7). The SDK comes from global.json;
# the .NET 11 run rolls the tests forward to that runtime. Every action is
# pinned by its commit (R-PROC-6).
name: verify

# A pull request is checked once, through pull_request, and main again once
# it is merged. Pushing a branch with an open pull request starts no second
# set of the same checks.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request replaces its checks still running. On main
# every merge is checked to the end.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: ["10.0", "11.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned SDK, and the runtime tested
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: ${{ matrix.runtime }}.x
      # The live tests run against the nightly image on Linux, its turboreld
      # started by the tests themselves, as the live suite's variable names it
      # (RULES.md R-TEST-8). The image is Linux's alone, so on macOS and
      # Windows the variable is unset and the live tests are skipped.
      - name: The live tests' server, from the nightly image
        if: ${{ runner.os == 'Linux' }}
        run: |
          docker pull ghcr.io/turborel/turborel:nightly
          echo "TURBOREL_TEST_TURBORELD=docker run --rm -i --network host -v /tmp:/tmp --user $(id -u):$(id -g) ghcr.io/turborel/turborel:nightly" >> "$GITHUB_ENV"
          echo "TMPDIR=/tmp" >> "$GITHUB_ENV"
      - name: Every check
        timeout-minutes: 30
        run: dotnet run tools/verify.cs -- --roll-forward ${{ matrix.runtime == '11.0' && 'LatestMajor' || 'Minor' }}
      - name: Stop the live tests' server
        if: ${{ always() && runner.os == 'Linux' }}
        run: docker ps -q --filter ancestor=ghcr.io/turborel/turborel:nightly | xargs -r docker rm -f
      - name: Keep the coverage report
        if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.runtime == '10.0' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: TestResults/coverage.cobertura.*.xml
          if-no-files-found: ignore
      - name: The package, as release.yml makes it (D13)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.runtime == '10.0' }}
        run: dotnet pack src/Turborel.Data/Turborel.Data.csproj --no-build -c Release -o artifacts/package
